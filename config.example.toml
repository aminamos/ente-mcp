# Copy to config.local.toml (same directory) or
# %APPDATA%/ente-mcp/config.toml / ~/.config/ente-mcp/config.toml
#
# Each [clients.<name>] is a desktop profile or an official-CLI app.
# Do not point two Ente desktops at the same profile directory.

default_client = "photos"
ente_cli = "ente"

# Museum server ops (trash, albums, links, account). Token comes from
# ENTE_MCP_TOKEN or `ente account get-token --email <email>`.
# [museum]
# endpoint = "https://api.ente.com"
# email = "you@example.com"

[clients.photos]
app = "photos"
process = "ente"
profile = "ente"
# queue = "~/Ente/Inbox"

[clients.auth]
app = "auth"

[clients.locker]
app = "locker"

# Self-hosted or a second desktop profile:
# [clients.museum]
# app = "photos"
# process = "etne"
# profile = "etne"
# queue = "~/Ente-museum/Inbox"
