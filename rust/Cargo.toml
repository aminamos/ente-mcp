[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/codegen",
    "apps/ensu/src-tauri",
    "bindings/frb/lib",
    "bindings/frb/locker",
    "bindings/frb/log",
    "bindings/frb/photos",
    "bindings/napi/photos",
    "bindings/uniffi/cast",
    "bindings/uniffi/ensu",
    "bindings/uniffi/log",
    "bindings/wasm/cast",
    "bindings/wasm/core-wasm",
    "bindings/wasm/ensu",
    "bindings/wasm/legacy",
    "bindings/wasm/lib",
    "bindings/wasm/log",
    "bindings/wasm/locker",
    "bindings/wasm/paste",
    "bindings/wasm/photos",
    "bindings/wasm/space",
    "crates/accounts",
    "crates/assets",
    "crates/cast",
    "crates/contacts",
    "crates/core",
    "crates/ensu",
    "crates/ensu-crypto",
    "crates/image",
    "crates/legacy",
    "crates/location",
    "crates/location-dataset",
    "crates/ml",
    "crates/paste",
    "crates/photos",
    "crates/space",
    "crates/test-support",
]

[workspace.dependencies]
dirs = "5.0.1"
ente-accounts = { path = "crates/accounts" }
ente-assets = { path = "crates/assets" }
ente-cast = { path = "crates/cast" }
ente-contacts = { path = "crates/contacts" }
ente-core = { path = "crates/core" }
ente-ensu = { path = "crates/ensu" }
ente-ensu-crypto = { path = "crates/ensu-crypto" }
ente-frb-lib = { path = "bindings/frb/lib" }
ente-frb-log = { path = "bindings/frb/log" }
ente-image = { path = "crates/image" }
ente-legacy = { path = "crates/legacy" }
ente-location = { path = "crates/location" }
ente-ml = { path = "crates/ml" }
ente-paste = { path = "crates/paste" }
ente-photos = { path = "crates/photos" }
ente-space = { path = "crates/space" }
ente-test-support = { path = "crates/test-support" }
ente-uniffi-log = { path = "bindings/uniffi/log" }
ente-wasm-lib = { path = "bindings/wasm/lib" }
ente-wasm-log = { path = "bindings/wasm/log" }
fast_image_resize = { version = "5.5.0", features = ["image"] }
flate2 = "1.1.9"
flutter_rust_bridge = "=2.12.0"
flutter_rust_bridge_codegen = "=2.12.0"
futures-util = "0.3.32"
getrandom = { version = "0.4.0", features = ["wasm_js"] }
hkdf = "0.13.0"
hmac = "0.13.0"
image = "0.25.10"
js-sys = "0.3.102"
log = "0.4.29"
md-5 = "0.11.0"
mockito = "1.7.2"
ort = { version = "=2.0.0-rc.13", default-features = false }
ort-sys = { version = "=2.0.0-rc.13", default-features = false }
regex = "1.11.1"
reqwest = { version = "0.12.28", default-features = false }
rusqlite = { version = "0.38.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
sha1 = "0.11.0"
sha2 = "0.11.0"
srp = { version = "0.7.0-rc.3", default-features = false }
subtle = "2.0.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.41.0"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
uniffi = { version = "=0.31.0" }
uniffi_bindgen = { version = "=0.31.0", default-features = false, features = ["cargo-metadata"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = "1.23.1"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
zeroize = { version = "1.9.0", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Unoptimized Argon2 makes production-strength derivations dominate test runtime.
[profile.dev.package.argon2]
opt-level = 3
